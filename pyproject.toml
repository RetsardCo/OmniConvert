[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omniconvert"
version = "1.0.0"
description = "Universal Windows desktop file-processing and conversion workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
    "pypdf>=4.0.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "pdf2docx>=0.5.8",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "Markdown>=3.5.0",
    "py7zr>=0.21.0",
    "pyttsx3>=2.90",
    "pytesseract>=0.3.10",
    "pyyaml>=6.0.0",
    "defusedxml>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]


